server {
    listen 80;
    server_name comments.alankyle.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/remark42-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name comments.alankyle.com;
    ssl_certificate /etc/letsencrypt/live/comments.alankyle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comments.alankyle.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 6m;
    }
}
