[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "22"
VITE_REMARK42_HOST = "https://comments.alankyle.com"
VITE_REMARK42_SITE_ID = "alankyle"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
